<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline | EagleGlow</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0a0a0a;
        color: #f2efe6;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .card {
        max-width: 380px; background: #111111;
        border: 1px solid rgba(201, 168, 76, 0.35);
        border-radius: 16px; padding: 36px 28px;
      }
      img { width: 96px; height: 96px; border-radius: 50%; }
      h1 {
        font-family: Cinzel, Georgia, "Times New Roman", serif;
        color: #c9a84c; font-size: 1.5rem; margin: 20px 0 10px;
        letter-spacing: 0.04em;
      }
      p { margin: 0 0 24px; line-height: 1.55; color: #bdb8a8; font-size: 0.95rem; }
      button {
        background: #c9a84c; color: #0a0a0a; border: 0; border-radius: 10px;
        padding: 12px 28px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="EagleGlow" />
      <h1>You're offline</h1>
      <p>EagleGlow can't reach the internet right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
